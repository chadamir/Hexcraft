<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexcraft — Train Game Map Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8e4da; --ink2:#b4ae9f; --ink3:#7f7a6e;
  --bg0:#15161a; --bg1:#1c1e23; --bg2:#24272d; --bg3:#2e3239; --line:#3a3e46;
  --accent:#f0a830; --accent2:#ffcf7a; --danger:#e5534b; --ok:#57ab5a;
  --canvas:#2a2c31;
  --r:6px;
  --ui:'Barlow', system-ui, sans-serif; --cond:'Barlow Condensed', 'Barlow', sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--ink);font:14px/1.35 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:46px 1fr 26px;grid-template-columns:260px 1fr 310px;height:100vh;grid-template-areas:"top top top" "left main right" "status status status"}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg1);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:700 18px var(--cond);letter-spacing:.04em;text-transform:uppercase;margin-right:10px;white-space:nowrap}
.brand svg{flex:none}
.brand small{font:500 12px var(--ui);color:var(--ink3);letter-spacing:0;text-transform:none}
#projName{background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 6px;width:180px;color:var(--ink);font-weight:600}
#projName:hover{border-color:var(--line)} #projName:focus{border-color:var(--accent);outline:none;background:var(--bg0)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.tb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink);white-space:nowrap;font-weight:500}
.tb:hover{background:var(--bg3)} .tb:active{background:var(--line)}
.tb.primary{background:var(--accent);color:#1a1405;font-weight:700} .tb.primary:hover{background:var(--accent2)}
.tb svg{width:16px;height:16px;flex:none}
.tb[disabled]{opacity:.35;pointer-events:none}
.spacer{flex:1}
#saveState{font-size:12px;color:var(--ink3);white-space:nowrap}
#saveState.dirty{color:var(--accent2)}
.menu{position:relative}
.menu-list{position:absolute;top:34px;left:0;min-width:220px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:0 12px 32px #0008;z-index:50;display:none}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer}
.menu-list button:hover{background:var(--bg3)}
.menu-list button kbd{margin-left:auto}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
kbd{font:11px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
/* side panels */
#left,#right{background:var(--bg1);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 9px;font:600 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sec h3 .grow{flex:1}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tool{position:relative;height:40px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--ink2)}
.tool:hover{color:var(--ink);border-color:var(--ink3)}
.tool.on{background:var(--accent);border-color:var(--accent);color:#1a1405}
.tool svg{width:20px;height:20px}
.tool kbd{position:absolute;right:2px;bottom:1px;border:0;padding:0;font-size:9px;color:inherit;opacity:.6}
#toolHint{font-size:12px;color:var(--ink3);margin-top:8px;min-height:32px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.sw{aspect-ratio:1;border-radius:4px;border:1px solid #0006;cursor:pointer;position:relative}
.sw:hover{transform:scale(1.12);z-index:1}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw.add{display:grid;place-items:center;background:var(--bg2);border:1px dashed var(--ink3);color:var(--ink3);font-weight:700}
.curcolor{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.curcolor input[type=color]{width:40px;height:30px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stamp{aspect-ratio:1;border-radius:var(--r);border:1px solid var(--line);background:#f3efe4;cursor:pointer;display:grid;place-items:center;padding:3px;position:relative}
.stamp svg,.stamp img{width:100%;height:100%;object-fit:contain}
.stamp:hover{border-color:var(--ink2)}
.stamp.on{outline:2px solid var(--accent);outline-offset:1px}
.stamp .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:11px;line-height:16px;text-align:center;display:none}
.stamp:hover .x{display:block}
.cat{font:600 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:10px 0 5px}
/* fields */
.f{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;margin:6px 0}
.f>label{color:var(--ink2);font-size:13px}
.f.full{grid-template-columns:1fr}
.row{display:flex;gap:6px;align-items:center}
.row>*{min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:5px;padding:5px 7px;outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{font:12.5px/1.45 var(--mono);resize:vertical;min-height:90px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px} input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink2);margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--ink3);background:var(--bg3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:700}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{color:#ffb3ad} .btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:2px 7px;font-size:12px}
.btn.icon{padding:3px 6px}
.btngrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.btngrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg0);padding:5px 4px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--bg3);color:var(--accent2);font-weight:600}
.help{font-size:12px;color:var(--ink3);margin:4px 0 2px;line-height:1.45}
.help code{font:11.5px var(--mono);color:var(--ink2);background:var(--bg0);padding:0 3px;border-radius:3px}
.card{border:1px solid var(--line);border-radius:7px;padding:8px;margin:7px 0;background:var(--bg2)}
.card-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.card-h .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .f{grid-template-columns:70px 1fr}
.card .f.full{grid-template-columns:1fr}
.pill{font:600 10px var(--cond);letter-spacing:.08em;text-transform:uppercase;background:var(--bg0);border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--ink2)}
.empty{color:var(--ink3);font-size:12.5px;padding:6px 0}
.trk{display:flex;align-items:center;gap:6px;font:12px var(--mono);padding:3px 0}
.trk span{flex:1}
/* stage */
#main{grid-area:main;position:relative;overflow:hidden;background:var(--canvas);background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none}
#main.pan, #main.pan *{cursor:grab!important}
#main.panning, #main.panning *{cursor:grabbing!important}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:2px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 6px 18px #0006}
.zoomctl button{border:0;background:none;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--ink2);font-weight:600}
.zoomctl button:hover{background:var(--bg3);color:var(--ink)}
#zoomPct{font:12px var(--mono);min-width:48px;text-align:center;align-self:center;color:var(--ink2)}
/* status */
#status{grid-area:status;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--bg1);border-top:1px solid var(--line);font:12px var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden}
#status b{color:var(--ink2);font-weight:600}
/* modal */
.modal-bg{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:100;padding:20px}
.modal-bg.open{display:grid}
.modal{background:var(--bg1);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px #000a}
.modal h2{margin:0;padding:16px 18px 10px;font:700 20px var(--cond);letter-spacing:.03em}
.modal .mb{padding:4px 18px 10px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.pitem .nm{flex:1;min-width:0}
.pitem .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .nm small{color:var(--ink3);font-size:12px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.preset{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:var(--bg2);text-align:left}
.preset:hover{border-color:var(--ink3)}
.preset.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset b{display:block;font:700 15px var(--cond);letter-spacing:.03em}
.preset small{color:var(--ink3);font-size:12px}
.tabs{display:flex;gap:4px;margin:4px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--bg2);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#1a1405}
#tip{position:fixed;z-index:400;max-width:290px;background:#0f1013;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:12.5px/1.45 var(--ui);box-shadow:0 10px 28px #000a;pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s;left:-999px;top:-999px}
#tip.show{opacity:1;transform:none}
#tip b{color:var(--accent2)} #tip kbd{color:var(--ink2)}
.modal.wide{width:min(900px,100%)}
.help-wrap{display:grid;grid-template-columns:200px 1fr;gap:16px;min-height:420px}
.help-nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:10px}
.help-nav button{text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:500}
.help-nav button:hover{background:var(--bg3);color:var(--ink)}
.help-nav button.on{background:var(--bg3);color:var(--accent2);font-weight:600}
.help-body{overflow:auto;max-height:62vh;padding-right:6px;line-height:1.55;color:var(--ink)}
.help-body h3{margin:0 0 8px;font:700 19px var(--cond);letter-spacing:.03em}
.help-body h4{margin:14px 0 6px;font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.help-body p,.help-body li{color:var(--ink2)} .help-body b{color:var(--ink)}
.help-body ul,.help-body ol{padding-left:20px;margin:6px 0} .help-body li{margin:4px 0}
.help-body code{font:12px var(--mono);background:var(--bg0);padding:1px 4px;border-radius:3px;color:var(--accent2)}
.help-body .tipline{border-left:3px solid var(--accent);padding:6px 10px;background:var(--bg2);border-radius:0 6px 6px 0}
.kt{border-collapse:collapse;width:100%} .kt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)} .kt td:first-child{white-space:nowrap;width:120px}
@media (max-width:700px){.help-wrap{grid-template-columns:1fr}.help-nav{flex-direction:row;flex-wrap:wrap;border-right:0}}
#compMain{grid-area:main;position:relative;overflow:hidden;background:var(--canvas);background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:22px 22px}
#compMain[hidden],#main[hidden]{display:none}
#compScroll{position:absolute;inset:0;overflow:auto;padding:30px}
#compCanvas{width:max-content;margin:0 auto}
.compempty{max-width:520px;margin:60px auto;color:var(--ink2);line-height:1.6}
.compempty h2{font:700 26px var(--cond);color:var(--ink);margin:0 0 8px}
.viewtabs{display:flex;background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:6px}
.viewtabs button{border:0;background:none;padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--ink2);font-weight:600}
.viewtabs button.on{background:var(--accent);color:#1a1405}
.colist{display:flex;flex-direction:column;gap:4px}
.coitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.coitem:hover{background:var(--bg2)} .coitem.on{background:var(--bg2);border-color:var(--accent)}
.coitem svg{flex:none} .coitem .nm{min-width:0;flex:1}
.coitem .codup{opacity:0;transition:.12s} .coitem:hover .codup,.coitem.on .codup{opacity:1} .coitem b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .coitem small{color:var(--ink3);font-size:12px}
.logostyles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.lgs{background:var(--bg0);border:1px solid var(--line);border-radius:7px;padding:4px;cursor:pointer;display:grid;place-items:center}
.lgs.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#main.picking, #main.picking *{cursor:crosshair!important}
#toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--line);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:200;box-shadow:0 10px 30px #0008;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--danger)}
.busy{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:150;font:600 16px var(--ui)}
.busy.open{display:grid}
.busy div{background:var(--bg1);border:1px solid var(--line);padding:18px 26px;border-radius:10px}
@media (max-width:1100px){#app{grid-template-columns:220px 1fr 270px}}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:46px 1fr 220px 26px;grid-template-areas:"top" "main" "right" "status"} #left{display:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 1.5 23 7.25v11.5L13 24.5 3 18.75V7.25Z" fill="#f0a830"/><path d="M7 15.5h12M7 11h12M9.5 8v10.5M16.5 8v10.5" stroke="#1a1405" stroke-width="1.8" stroke-linecap="round"/></svg>
      Hexcraft
    </div>
    <input id="projName" type="text" spellcheck="false" title="Map name">
    <div class="viewtabs" id="viewTabs"><button data-view="map" class="on">Map</button><button data-view="comp">Companies</button></div>
    <div class="sep"></div>
    <div class="menu" id="fileMenu">
      <button class="tb" data-menu>File <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="menu-list">
        <button data-act="new">New map…</button>
        <button data-act="open">Open saved maps… <kbd>Ctrl O</kbd></button>
        <button data-act="save">Save <kbd>Ctrl S</kbd></button>
        <button data-act="saveas">Save as copy…</button>
        <hr>
        <button data-act="savefile">Download project file (.json)</button>
        <button data-act="openfile">Open project file…</button>
        <hr>
        <button data-act="maker-import">Import 18xx Maker game (.json)…</button>
        <button data-act="maker-export">Export for 18xx Maker (.json)</button>
        <hr>
        <button data-act="gamedata-export">Export game data (.json)</button>
        <button data-act="gamedata-check" id="gdCheckBtn">Check game data on the map</button>
      </div>
    </div>
    <div class="menu" id="insertMenu">
      <button class="tb" data-menu>Insert <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="menu-list">
        <button data-act="ins-market1">Stock market — 1D track</button>
        <button data-act="ins-market2">Stock market — 2D grid</button>
        <button data-act="ins-table">Information table</button>
        <button data-act="ins-text">Text box</button>
        <button data-act="ins-revbox">Off-board revenue box</button>
        <hr>
        <button data-act="ins-image">Image from file…</button>
        <button data-act="upload-icon">Upload custom icons…</button>
        <button data-act="upload-bg">Set background image…</button>
      </div>
    </div>
    <div class="menu" id="helpMenu">
      <button class="tb" data-menu>Help <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="menu-list">
        <button data-act="help-start">Getting started <kbd>?</kbd></button>
        <button data-act="help-tools">Tools &amp; keyboard shortcuts</button>
        <button data-act="help-hexes">Hexes &amp; hex types</button>
        <button data-act="help-cities">Cities, towns &amp; labels</button>
        <button data-act="help-track">Pre-printed track</button>
        <button data-act="help-shape">Map shape &amp; irregular maps</button>
        <button data-act="help-markets">Stock markets</button>
        <button data-act="help-companies">Companies, shares &amp; charters</button>
        <button data-act="help-tables">Information tables</button>
        <button data-act="help-images">Your own icons &amp; backgrounds</button>
        <button data-act="help-saving">Saving your work</button>
        <button data-act="help-export">Exporting &amp; printing</button>
        <button data-act="help-gamedata">Game data for programs</button>
        <hr>
        <button data-act="toggle-tips" id="tipsToggle">Hover tips: on</button>
      </div>
    </div>
    <div class="sep"></div>
    <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2.5 6H10a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="tb" id="redoBtn" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 16 16"><path d="M11 3l3 3-3 3M13.5 6H6a4 4 0 0 0 0 8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="spacer"></div>
    <span id="saveState">Not saved yet</span>
    <button class="tb" id="saveBtn" title="Save (Ctrl+S)"><svg viewBox="0 0 16 16"><path d="M3 2h8l3 3v9H2V2Zm2 0v4h6V2M4.5 14V9h7v5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Save</button>
    <button class="tb primary" id="exportBtn"><svg viewBox="0 0 16 16"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M2.5 11v3h11v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Export</button>
  </header>

  <aside id="left">
   <div id="compLeft" hidden></div>
   <div id="mapLeft">
    <div class="sec">
      <h3>Tools</h3>
      <div class="tools" id="tools"></div>

<script>// ---------- Built-in icon library (100x100 box, centered at 50,50) ----------
// Each icon: key -> {label, color (default primary), cat, draw(c, h)} where h = color helpers
const ICONS = (() => {
  const S = (d, fill, stroke, sw, extra = '') =>
    `<path d="${d}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"` : ''}${extra}/>`;
  const L = (d, stroke, sw, extra = '') =>
    `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;
  const I = {};
  const def = (key, label, cat, color, draw) => (I[key] = { key, label, cat, color, draw });

  // ---- Terrain ----
  def('mountain', 'Mountain', 'Terrain', '#8b6b4a', (c, h) =>
    S('M6 84 L38 26 L52 50 L63 34 L94 84 Z', c, h.dark(c, .45), 3) +
    S('M38 26 L30.2 40 L35 37.5 L39 41.5 L43 37.5 L46 40.6 Z', '#ffffff', null) +
    S('M63 34 L55.5 45 L59.5 43 L63 46 L66.5 43 L69.3 45 Z', '#ffffff', null));
  def('mountain1', 'Peak', 'Terrain', '#8b6b4a', (c, h) =>
    S('M10 84 L50 16 L90 84 Z', c, h.dark(c, .45), 3) +
    S('M50 16 L39 34.7 L45 31 L50 36 L55 31 L61 34.7 Z', '#ffffff', null));
  def('hills', 'Hills', 'Terrain', '#9fb35d', (c, h) =>
    S('M4 80 Q28 26 56 80 Z', c, h.dark(c, .4), 3) +
    S('M38 80 Q68 36 96 80 Z', h.dark(c, .12), h.dark(c, .4), 3));
  def('water', 'Water', 'Terrain', '#2f7fc1', (c) =>
    L('M10 34 q10 -10 20 0 t20 0 t20 0 t20 0', c, 6) +
    L('M10 52 q10 -10 20 0 t20 0 t20 0 t20 0', c, 6) +
    L('M10 70 q10 -10 20 0 t20 0 t20 0 t20 0', c, 6));
  def('lake', 'Lake', 'Terrain', '#4a9bd9', (c, h) =>
    `<ellipse cx="50" cy="54" rx="42" ry="27" fill="${c}" stroke="${h.dark(c, .4)}" stroke-width="3"/>` +
    L('M28 50 q6 -6 12 0 t12 0', h.light(c, .6), 4) + L('M48 62 q6 -6 12 0 t12 0', h.light(c, .6), 4));
  def('river', 'River', 'Terrain', '#2f7fc1', (c, h) =>
    L('M8 92 C 34 72, 18 52, 50 50 S 66 26, 92 8', h.dark(c, .35), 13) +
    L('M8 92 C 34 72, 18 52, 50 50 S 66 26, 92 8', c, 8));
  def('forest', 'Forest', 'Terrain', '#2e7d32', (c, h) => {
    const t = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">` +
      `<rect x="-4" y="22" width="8" height="12" fill="#6b4a2b"/>` +
      S('M0 -34 L18 -6 L9 -6 L24 22 L-24 22 L-9 -6 L-18 -6 Z', c, h.dark(c, .45), 3 / s) + '</g>';
    return t(32, 52, .85) + t(66, 46, 1);
  });
  def('tree', 'Tree', 'Terrain', '#5aa042', (c, h) =>
    `<rect x="45" y="52" width="10" height="36" fill="#6b4a2b"/>` +

function deleteSel() {

// company homes / destinations and link ends follow their hexes when rows or columns move
function remapHexRefs(mk) {
  (P.companies || []).forEach((co) => { if (co.home) { const [hk, i, sl] = co.home.split('|'); co.home = `${mk(hk)}|${i}|${sl}`; } if (co.dest) co.dest = mk(co.dest); });
  remapLinkHexes(mk);
}
function dropHexRefs(pred) {
  (P.companies || []).forEach((co) => { if (co.home) { const [c, r] = unkey(co.home.split('|')[0]); if (pred(c, r)) co.home = ''; } if (co.dest) { const [c, r] = unkey(co.dest); if (pred(c, r)) co.dest = ''; } });
  dropLinksAt(pred);
}
function extendGrid(side, n, raw) {
  const g = P.grid; const s = R();
  if ((side === 'top' || side === 'bottom') && g.rows + n < 1) return;
  if ((side === 'left' || side === 'right') && g.cols + n < 1) return;
  if (!raw) checkpoint();
  let dx = 0, dy = 0, dc = 0, dr = 0;
  if (side === 'top') { dr = n; if (isPointy()) { dy = 1.5 * s * n; if (n % 2) g.stagger = g.stagger === 'odd' ? 'even' : 'odd'; } else dy = SQ3 * s * n; g.rows += n; }
  if (side === 'bottom') g.rows += n;
  if (side === 'left') { dc = n; if (isPointy()) dx = SQ3 * s * n; else { dx = 1.5 * s * n; if (n % 2) g.stagger = g.stagger === 'odd' ? 'even' : 'odd'; } g.cols += n; }
  if (side === 'right') g.cols += n;
  if (dc || dr) {
    const remap = (obj) => { const out = {}; for (const k in obj) { const [c, r] = unkey(k); out[key(c + dc, r + dr)] = obj[k]; } return out; };
    P.hexes = remap(P.hexes); P.voids = remap(P.voids);
    const ne = {}; for (const k in P.edges) { const [c, r, i] = k.split(',').map(Number); ne[(c + dc) + ',' + (r + dr) + ',' + i] = P.edges[k]; } P.edges = ne;
    P.objects.forEach((o) => { o.x += dx; o.y += dy; });
    remapHexRefs((k) => { const [c, r] = unkey(k); return key(c + dc, r + dr); });
    if (P.bgImage) { P.bgImage.x += dx; P.bgImage.y += dy; }
    S.view.x -= dx * S.view.z; S.view.y -= dy * S.view.z; applyView();
  }
  // prune outside grid
  for (const k in P.hexes) { const [c, r] = unkey(k); if (!inGrid(c, r)) delete P.hexes[k]; }
  for (const k in P.voids) { const [c, r] = unkey(k); if (!inGrid(c, r)) delete P.voids[k]; }
  for (const k in P.edges) { const { c, r } = edgeFromKey(k); if (c < -1 || r < -1 || c > g.cols || r > g.rows) delete P.edges[k]; }
  dropHexRefs((c, r) => !inGrid(c, r));
  if (raw) return;
  if (S.sel && S.sel.kind === 'hex') S.sel = null;
  renderAll(); renderProps();
}

const EDGE_NAMES = () => (isPointy() ? ['E', 'SE', 'SW', 'W', 'NW', 'NE'] : ['SE', 'S', 'SW', 'NW', 'N', 'NE']);

  if (!it) return '?';

}
function insertLines(axis, index, n) {
  checkpoint();
  const mk = shiftLines(axis, index, n);
  if (S.sel && S.sel.kind === 'hex') S.sel = { kind: 'hex', k: mk(S.sel.k) };
  _relKey = ''; renderAll(); renderProps();
  toast(`Inserted ${n} ${axis === 'row' ? 'row' : 'column'}${n > 1 ? 's' : ''}${n % 2 && ((isPointy() && axis === 'row') || (!isPointy() && axis === 'col')) ? ' — the far side moved half a hex to stay lined up' : ''}`);
}
function deleteLine(axis, index, n = 1) {
  checkpoint();
  const g = P.grid; n = Math.max(1, Math.min(n, axis === 'row' ? g.rows - index : g.cols - index));
  const inLine = (c, r) => { const t = axis === 'row' ? r : c; return t >= index && t < index + n; };
  for (const k in P.hexes) { const [c, r] = unkey(k); if (inLine(c, r)) delete P.hexes[k]; }
  for (const k in P.edges) { const [c, r] = k.split(',').map(Number); if (inLine(c, r)) delete P.edges[k]; }
  dropHexRefs(inLine);
  for (let j = index; j < index + n; j++) for (let t = 0; t < (axis === 'row' ? g.cols : g.rows); t++) P.voids[axis === 'row' ? key(t, j) : key(j, t)] = 1;
  shiftLines(axis, index + n, -n);
  const rowEmpty = (r) => { for (let c = 0; c < P.grid.cols; c++) if (!P.voids[key(c, r)]) return false; return true; };
  const colEmpty = (c) => { for (let r = 0; r < P.grid.rows; r++) if (!P.voids[key(c, r)]) return false; return true; };
  const hexIn = (pred) => Object.keys(P.hexes).some((k) => pred(...unkey(k)));
  while (P.grid.rows > 1 && rowEmpty(P.grid.rows - 1) && !hexIn((c, r) => r === P.grid.rows - 1)) P.grid.rows--;
  while (P.grid.cols > 1 && colEmpty(P.grid.cols - 1) && !hexIn((c) => c === P.grid.cols - 1)) P.grid.cols--;
  for (const k in P.voids) { const [c, r] = unkey(k); if (!inGrid(c, r)) delete P.voids[k]; }
  S.sel = null; _relKey = ''; renderAll(); renderProps();
  toast(`Deleted ${n} ${axis === 'row' ? 'row' : 'column'}${n > 1 ? 's' : ''} — everything beyond moved in to close the gap (Ctrl Z to undo)`);
}
function linesSection(k) {
  const [c, r] = unkey(k), staggerAxis = isPointy() ? 'row' : 'col';
  return sec('Rows & columns', `<div class="help" style="margin-top:0">Insert space inside the map; everything beyond moves over with its contents.</div>
    <div class="f"><label>How many</label><div class="seg" id="insNSeg">${[1, 2, 3, 4].map((n) => `<button data-v="${n}" class="${S.insN === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="btngrid">
      <button class="btn sm" data-act="insLine" data-axis="row" data-idx="${r}">Insert row above</button><button class="btn sm" data-act="insLine" data-axis="row" data-idx="${r + 1}">Insert row below</button>
      <button class="btn sm" data-act="insLine" data-axis="col" data-idx="${c}">Insert column left</button><button class="btn sm" data-act="insLine" data-axis="col" data-idx="${c + 1}">Insert column right</button>
      <button class="btn sm danger" data-act="delLine" data-axis="row" data-idx="${r}">Delete row${S.insN > 1 ? 's' : ''} from here</button><button class="btn sm danger" data-act="delLine" data-axis="col" data-idx="${c}">Delete column${S.insN > 1 ? 's' : ''} from here</button>
    </div>
    <div class="help">${staggerAxis === 'row' ? 'Rows' : 'Columns'} are offset in this layout, so inserting or deleting an odd number of ${staggerAxis === 'row' ? 'rows' : 'columns'} shifts the far side half a hex sideways. Use 2 to keep everything lined up. “How many” applies to deleting too.</div>`);
}
handlers.insLine = (d) => insertLines(d.axis, +d.idx, S.insN);
handlers.delLine = (d) => { const n = S.insN, w = d.axis === 'row' ? 'row' : 'column'; confirmBox(`Delete ${n} ${w}${n > 1 ? 's' : ''}`, `Delete every hex in ${n > 1 ? `these ${n} ${w}s (starting at this hex's ${w})` : `this ${w}`} and close the gap? Everything beyond moves in.`, 'Delete', () => deleteLine(d.axis, +d.idx, n)); };

// Round maps: lift the automatic outside-the-circle hexes while rows/columns move, then re-cut the circle.
(() => {
  let depth = 0;
  const wrap = (fn) => function (...a) {
    if (depth || !isRound()) { depth++; try { return fn.apply(this, a); } finally { depth--; } }
    depth++; clearShapeVoids();
    try { return fn.apply(this, a); } finally { depth--; applyShapeVoids(); renderAll(); }
  };
  extendGrid = wrap(extendGrid); shiftLines = wrap(shiftLines); deleteLine = wrap(deleteLine);
})();

function compPreviewSVG(co, forExport = false) {
  const cs = CS(), gap = 8, lab = 4.2;
  const certs = certList(co);
  const nTok = co.kind === 'private' ? 0 : co.kind === 'cube' ? cs.extraTokens : (co.tokens.count || 0) + cs.extraTokens;
  const perRow = Math.max(1, Math.floor((Math.max(cs.charterW, 3 * cs.shareW + 2 * gap) + gap) / (cs.shareW + gap)));
  const W = Math.max(co.kind === 'private' ? 0 : cs.charterW, Math.min(certs.length, perRow) * (cs.shareW + gap) - gap, 120);
  let y = 0, s = '';
  const L = (t) => { s += textEl(0, y + lab * 0.8, t, { fs: lab * 0.8, bold: true, fam: 'sans', fill: forExport ? '#555' : '#b4ae9f' }); y += lab * 1.6; };
  if (co.kind !== 'private') { L(co.kind === 'cube' ? 'COMPANY CARD' : 'CHARTER'); s += `<g transform="translate(0 ${n2(y)})">${charterSVG(co, cs.charterW, cs.charterH)}</g>`; y += cs.charterH + gap * 1.5; }
  if (certs.length) {
    L(co.kind === 'private' ? 'PRIVATE COMPANY CARD' : `SHARE CERTIFICATES (${certs.length})`);
    certs.forEach((ct, i) => { const cx = (i % perRow) * (cs.shareW + gap), cy = y + Math.floor(i / perRow) * (cs.shareH + gap); s += `<g transform="translate(${n2(cx)} ${n2(cy)})">${shareSVG(co, ct, cs.shareW, cs.shareH)}</g>`; });
    y += Math.ceil(certs.length / perRow) * (cs.shareH + gap) + gap * 0.5;
  }
  if (nTok > 0) {
    L(`TOKENS (${nTok}) — ${cs.tokenMM} mm`);
    const d = cs.tokenMM, per = Math.max(1, Math.floor(W / (d + 3)));
    for (let i = 0; i < nTok; i++) s += `<g transform="translate(${n2((i % per) * (d + 3) + d / 2)} ${n2(y + Math.floor(i / per) * (d + 3) + d / 2)})">${tokenSVG(co, d)}</g>`;
    y += Math.ceil(nTok / per) * (d + 3);
  }
  return { s, w: W, h: y };
}

function shelfPack(items, aw, ah, gap) {

  items.forEach((it) => {
    let w = it.w, h = it.h, k = 1;
    if (w > aw || h > ah) { k = Math.min(aw / w, ah / h); w *= k; h *= k; }
    if (x > 0 && x + w > aw + 0.01) { x = 0; y += rowH + gap; rowH = 0; }
    if (y > 0 && y + h > ah + 0.01) { pages.push(page); page = []; x = 0; y = 0; rowH = 0; }

}

// =====================================================================
//  Game data export: what the map means, for programs that play the game
//  (File › Export game data). The drawing is for people; this file is for
//  software: every hex with its coordinate, terrain kind, build cost and
//  tags; cities and towns with names, slots, values and home companies;
//  hexsides as pairs of hexes; named regions; companies.
// =====================================================================

const GAME_DATA_FORMAT = 'hexcraft-game-data', GAME_DATA_VERSION = 1;
// Suggested terrain kinds (any word may be used; these are only offered in the editor)
const HEX_KINDS = ['plain', 'rough', 'hill', 'mountain', 'forest', 'swamp', 'desert', 'water', 'lake', 'river', 'coast', 'offboard', 'city', 'town', 'port'];

// splitTags() and numbersIn() live in core.js (links use them too)

// A cost printed on the hex (a Cost stamp: triangle or wave label, or a label like "$60"), as a number
function printedCost(items) {
  for (const it of items || []) {
    if (it.t !== 'text') continue;
    const txt = String(it.text || '').trim();
    if (it.style === 'triangle' || it.style === 'wave' || /^\$\s?\d+$/.test(txt)) { const n = numbersIn(txt); if (n.length === 1) return n[0]; }
  }

}

    const m = tok.match(/^([a-z]*)(-?\d+)/i); if (!m) return null;
    const code = (m[1] || '').toLowerCase(), zone = ZONE_CODES[code];

    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }

function gameData() {
  const hexId = (c, r) => coordLabel(c, r) || key(c, r);
  const ref = (c, r) => ({ id: hexId(c, r), col: c, row: r });
  // which company has its home in which city slot: 'c,r|item|slot' -> company id
  const homeOf = {};
  (P.companies || []).forEach((co) => { if (co.home) homeOf[co.home] = co.id; });

  const hexes = [];
  for (let r = 0; r < P.grid.rows; r++) for (let c = 0; c < P.grid.cols; c++) {
    if (!exists(c, r)) continue;
    const k = key(c, r), h = P.hexes[k] || null, ty = hexType(h);
    const items = [...((ty && ty.items) || []), ...((h && h.items) || [])];
    const typeCount = ((ty && ty.items) || []).length;   // items from the type come first; the hex's own items follow
    const [x, y] = center(c, r);
    const cost = h && h.cost !== undefined && h.cost !== '' ? numbersIn(h.cost)[0] ?? null
      : ty && ty.cost !== undefined && ty.cost !== '' ? numbersIn(ty.cost)[0] ?? null

      ...ref(c, r), x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100,
      kind: (h && h.kind) || (ty && ty.kind) || (h || ty ? null : 'plain'),
      cost: cost ?? null,
      tags: [...new Set([...splitTags(ty && ty.tags), ...splitTags(h && h.tags)])],
      type: ty ? ty.name : null,
      color: effFill(h) || null,
      label: ((h && h.items) || []).filter((it) => it.nm && it.text).map((it) => it.text)[0] || null,
      cities: [], towns: [], revenues: [], texts: [], track: [],
    };
    items.forEach((it, i) => {
      // the index used by company homes counts only this hex's own items
      const own = i - typeCount;
      if (it.t === 'city') {
        const homes = [];
        if (own >= 0) for (let slot = 0; slot < (it.slots || 1); slot++) { const id = homeOf[`${k}|${own}|${slot}`]; if (id) homes.push({ slot, company: id }); }

          marks: splitTags(it.labels), homes, tags: splitTags(it.tags), place: placeOf(it.place) });
      } else if (it.t === 'town') {
        out.towns.push({ name: it.name || null, values: numbersIn(it.rev), revenue: it.rev || null, style: it.style || 'dot',

  const regions = (P.objects || []).filter((o) => o.t === 'region' && o.pts && o.pts.length > 2).map((o, n) => {
    const pts = o.pts.map(([px, py]) => [px + (o.x || 0), py + (o.y || 0)]);

  const labels = (P.objects || []).filter((o) => o.t === 'text' && o.text).map((o) => ({ text: o.text, x: Math.round(o.x || 0), y: Math.round(o.y || 0) }));

    const [c, r] = unkey(e.k), h = P.hexes[e.k], it = linkItem(e), out = { ...ref(c, r), place: null, index: null, name: null };
    if (!it) return out;

    id: l.id, from: linkEndOut(l.a), to: linkEndOut(l.b),
    cost: numbersIn(l.cost)[0] ?? null, length: linkLength(l), color: l.color || null, style: l.style || 'solid', tags: splitTags(l.tags),
  }));

  const b = hexBoundsExisting();

    format: GAME_DATA_FORMAT, version: GAME_DATA_VERSION, app: 'hexcraft', name: P.name, exported: new Date().toISOString(),
    grid: { orient: P.grid.orient, stagger: P.grid.stagger, cols: P.grid.cols, rows: P.grid.rows, size: P.grid.size, coords: P.style.coords,
      bounds: { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) } },
    page: pageBounds(),   // the export page (SVG viewBox), so art exports line up
    hexes, sides, regions, links, companies, labels,
  };
}

// File › Export game data: checks the map, then downloads <name>.game.json
function exportGameData() {
  closeMenus();
  try { P.page = pageRound(contentBounds(true)); } catch (e) {}
  const data = gameData();
  const notes = [];
  const unnamed = data.hexes.reduce((n, h) => n + h.cities.filter((c) => !c.name).length + h.towns.filter((t) => !t.name).length, 0);
  if (unnamed) notes.push(`${unnamed} cit${unnamed === 1 ? 'y or town has' : 'ies or towns have'} no name`);
  const names = {}; data.hexes.forEach((h) => [...h.cities, ...h.towns].forEach((p) => { if (p.name) names[p.name] = (names[p.name] || 0) + 1; }));
  const dup = Object.keys(names).filter((n) => names[n] > 1);
  if (dup.length) notes.push(`names used more than once: ${dup.slice(0, 6).join(', ')}${dup.length > 6 ? '…' : ''}`);
  const noKind = data.hexes.filter((h) => !h.kind).length;
  if (noKind) notes.push(`${noKind} hex${noKind === 1 ? ' has' : 'es have'} no terrain kind (set Kind on the hex type or the hex)`);
  saveBlob(slug(P.name) + '.game.json', JSON.stringify(data, null, 1), 'application/json');
  if (notes.length) toast('Exported. Check: ' + notes.join('; ') + '. File › Check game data shows them on the map.', true);
}

// ---------------- Downloads ----------------
let _dl = null;

    try { await dl.save({ filename, data }); toast('Saved ' + filename); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Download cancelled'); return false; }
      if (e && e.code === 'rate_limited') { toast('A download prompt is already open — finish that one first.', true); return false; }
      if (e && e.code === 'too_large') { toast('That file is too large to download here. Try a smaller scale.', true); return false; }
      console.warn('downloads.save failed, falling back', e);
    }
  }

  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Downloaded ' + filename);

// ---------------- File picking & uploads ----------------

// ---------------- Browser storage (IndexedDB) ----------------
const IDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('hexwright', 1);
        rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects'); if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
        rq.onsuccess = () => { this._db = rq.result; res(this._db); }; rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
  },
  async tx(store, mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const st = t.objectStore(store); const r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  get(store, k) { return this.tx(store, 'readonly', (s) => s.get(k)); },
  put(store, k, v) { return this.tx(store, 'readwrite', (s) => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', (s) => s.delete(k)); },
  async all(store) { const d = await this.open(); return new Promise((res, rej) => { const out = []; const t = d.transaction(store, 'readonly'); const rq = t.objectStore(store).openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { out.push(c.value); c.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); },
};

// ---------------- Cloud library (per-person, private) ----------------
const Cloud = {
  ready: false, db: null, uid: null,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.uid = id; this.ready = true; updateSaveState();
    } catch (e) { console.warn('cloud init', e); }
  },
  col() { return this.db.collection('data/users/' + this.uid); },
  async retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } },
  async list() { const snap = await this.retry(() => this.col().where('kind', '==', 'meta').get()); return snap.docs.map((d) => ({ id: d.id.slice(2), ...d.data() })); },
  async save(pid, name, json, thumb) {
    const CH = 150000, n = Math.max(1, Math.ceil(json.length / CH)); const col = this.col();
    let oldN = 0; try { const m = await col.doc('m_' + pid).get(); if (m.exists) oldN = m.data().chunks || 0; } catch (e) {}
    for (let i = 0; i < n; i++) { const part = json.slice(i * CH, (i + 1) * CH); await this.retry(() => col.doc(`c_${pid}_${i}`).set({ kind: 'chunk', pid, i, s: part })); }
    await this.retry(() => col.doc('m_' + pid).set({ kind: 'meta', name, updated: Date.now(), chunks: n, size: json.length, thumb: thumb && thumb.length < 60000 ? thumb : '' }));
    for (let i = n; i < oldN; i++) { try { await col.doc(`c_${pid}_${i}`).delete(); } catch (e) {} }
  },
  async load(pid) {
    const col = this.col(); const m = await this.retry(() => col.doc('m_' + pid).get()); if (!m.exists) throw new Error('Map not found');
    const n = m.data().chunks; const parts = [];
    for (let i = 0; i < n; i++) { const d = await this.retry(() => col.doc(`c_${pid}_${i}`).get()); if (!d.exists) throw new Error('Part of this map is missing'); parts.push(d.data().s); }
    return parts.join('');
  },
  async remove(pid) { const col = this.col(); const m = await col.doc('m_' + pid).get(); const n = m.exists ? m.data().chunks || 0 : 0; await col.doc('m_' + pid).delete(); for (let i = 0; i < n; i++) { try { await col.doc(`c_${pid}_${i}`).delete(); } catch (e) {} } },
};

  'ins-market1': () => insertObject('market1'), 'ins-market2': () => insertObject('market2'), 'ins-table': () => insertObject('table'), 'ins-text': () => insertObject('text'),
  'toggle-tips': () => { setTips(!S.tips); $('#tipsToggle').textContent = 'Hover tips: ' + (S.tips ? 'on' : 'off'); },
  'ins-revbox': () => { checkpoint(); const [x, y] = viewCenterWorld(); const o = { id: uid('o'), t: 'revbox', values: 'y20 g30 b40 x60', cw: R() * 0.42, x: x - R() * 0.84, y }; P.objects.push(o); renderObject(o.id); select({ kind: 'obj', id: o.id }); setTool('select'); schedulePaper(); },
  'ins-image': insertImageObject, 'upload-icon': uploadIconsDialog, 'upload-bg': () => pickFiles('image/*,.svg', false, (f) => uploadBackground(f[0])),
};
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (!b || b.closest('#props')) return; if (b.dataset.act.startsWith('help-')) { closeMenus(); helpDialog(b.dataset.act.slice(5)); return; } const fn = ACTS[b.dataset.act]; if (fn) { closeMenus(); fn(); } });
$('#saveBtn').onclick = () => doSave();
$('#exportBtn').onclick = () => (S.view2 === 'comp' ? compExportDialog() : exportDialog());
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
$('#projName').addEventListener('input', (e) => { checkpoint('name'); P.name = e.target.value; });
$('#projName').addEventListener('change', () => renderProps());
// drag & drop project files / images onto the canvas
$('#main').addEventListener('dragover', (e) => { e.preventDefault(); });
$('#main').addEventListener('drop', async (e) => {
  e.preventDefault(); const files = [...(e.dataTransfer.files || [])]; if (!files.length) return;
  const proj = files.find((f) => /\.json$/i.test(f.name)); if (proj) { loadProject(await readText(proj)); return; }
  const ids = await addAssets(files, 'icon');
  if (ids.length) { S.stamp = { kind: 'asset', ref: ids[0] }; S.tool = 'stamp'; renderLeft(); toast(`Added ${ids.length} icon${ids.length > 1 ? 's' : ''} to Stamps › Your uploads`); }
});
function updateStatusSize() { const g = P.grid; $('#stSize').textContent = `${g.cols}×${g.rows} hexes`; }
window.addEventListener('beforeunload', () => { try { autosaveLocal(); } catch (e) {} });

// ---------------- Init ----------------
async function init() {
  dlCap(); Cloud.init();
  let restored = false;
  try { const a = await IDB.get('kv', 'current'); if (a && a.json) { const obj = JSON.parse(a.json); if (obj && obj.grid) { P = migrate(obj); restored = true; S.cloudLinked = !!a.cloud; } } } catch (e) { console.warn('restore failed', e); }
  if (!restored) P = demoProject();
  S.brush = { kind: 'color', color: P.palette[2] || '#f6dc4a' };
  applyStaticTips(); $('#tipsToggle').textContent = 'Hover tips: ' + (S.tips ? 'on' : 'off');
  renderAll(); renderLeft(); renderProps(); updateUndoBtns(); updateSaveState(); applyView();
  requestAnimationFrame(() => { fitView(); });
  if (restored) toast('Welcome back — restored your last map');
  else setTimeout(() => toast('New here? Press ? or open Help for a quick tour. Hover over anything to see what it does.'), 900);
}
init();
</script>
</body>
